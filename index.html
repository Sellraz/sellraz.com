<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cash on Delivery ভিত্তিক eCommerce স্টোর ও অ্যাডমিন প্যানেল">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Dokan Store Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout concept: one file, two apps. Storefront re-skins through --s-* theme tokens; admin uses neutral --a-* tokens with teal brand. */
:root{
  --a-bg:#f4f6f7;--a-surface:#ffffff;--a-fg:#15201f;--a-muted:#5f6f6d;--a-line:#dde4e3;--a-brand:#0f766e;--a-brandfg:#ffffff;--a-soft:#e7f3f1;
  --ok:#157f3b;--warn:#a85d00;--bad:#b42318;--info:#1d4ed8;
  --s-bg:#ffffff;--s-surface:#ffffff;--s-fg:#111111;--s-muted:#6b6b6b;--s-line:#e5e5e5;--s-accent:#111111;--s-afg:#ffffff;--s-radius:10px;
  --s-font:'Inter';--s-fontd:'Inter';
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --a-bg:#0e1514;--a-surface:#162120;--a-fg:#e6efee;--a-muted:#97aaa7;--a-line:#28403d;--a-brand:#2dd4bf;--a-brandfg:#06201d;--a-soft:#16312e;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd;color-scheme:dark}}
:root[data-theme="dark"]{
  --a-bg:#0e1514;--a-surface:#162120;--a-fg:#e6efee;--a-muted:#97aaa7;--a-line:#28403d;--a-brand:#2dd4bf;--a-brandfg:#06201d;--a-soft:#16312e;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--a-bg);color:var(--a-fg);font-family:'Inter','Hind Siliguri',system-ui,sans-serif;line-height:1.5}
body.view-shop{background:var(--s-bg);color:var(--s-fg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a-brand);outline-offset:2px}
.view-shop :focus-visible{outline-color:var(--s-accent)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- Storefront ---------- */
.st{background:var(--s-bg);color:var(--s-fg);font-family:var(--s-font),'Hind Siliguri',system-ui,sans-serif;min-height:100vh}
.st h1,.st h2,.st h3,.st .disp{font-family:var(--s-fontd),'Hind Siliguri',serif;text-wrap:balance}
.s-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--s-bg);border-bottom:1px solid var(--s-line)}
body.view-shop::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--s-bg)}
.s-head{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;margin-right:auto}
.logo{width:38px;height:38px;border-radius:var(--s-radius);background:var(--s-accent);color:var(--s-afg);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.bname{font-weight:800;font-size:clamp(20px,3.4vw,26px);line-height:1.1;letter-spacing:-.01em;font-family:var(--s-fontd),'Hind Siliguri',serif;overflow-wrap:anywhere}
.btag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--s-muted)}
.srch{flex:1 1 220px;min-width:0;max-width:420px;order:3}
.srch input{width:100%;padding:9px 14px;border:1px solid var(--s-line);border-radius:999px;background:var(--s-surface);color:var(--s-fg)}
.ib{border:1px solid var(--s-line);background:var(--s-surface);color:var(--s-fg);border-radius:var(--s-radius);padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.cnt{background:var(--s-accent);color:var(--s-afg);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-grid;place-items:center}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.chip{flex:none;border:2px solid var(--s-fg);background:transparent;color:var(--s-fg);border-radius:var(--s-radius);padding:7px 18px;font-size:15px;font-weight:700;letter-spacing:.01em}
.chip:hover{background:color-mix(in srgb,var(--s-accent) 12%,transparent)}
.chip.on{background:var(--s-accent);color:var(--s-afg);border-color:var(--s-accent)}
.banner{position:relative;margin-top:16px;border-radius:calc(var(--s-radius) + 4px);overflow:hidden;min-height:190px;background:var(--s-accent);color:var(--s-afg)}
.slide{position:absolute;inset:0;padding:28px clamp(18px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:8px;opacity:0;transition:opacity .6s;background:linear-gradient(120deg,var(--s-accent),color-mix(in srgb,var(--s-accent) 60%,#000))}
.slide.on{opacity:1}
.banner.img{aspect-ratio:16/6;min-height:140px}
.slide.im{padding:0;background:none}
.slide.im img{width:100%;height:100%;object-fit:cover;display:block}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.zones label{display:flex;gap:8px;align-items:center;border:1px solid var(--s-line);border-radius:10px;padding:10px;font-size:14px;cursor:pointer}
.zones label:has(input:checked){border-color:var(--s-accent);background:color-mix(in srgb,var(--s-accent) 8%,transparent)}
.bnl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-top:12px}
.bnl div{position:relative;border:1px solid var(--a-line);border-radius:10px;overflow:hidden}
.bnl img{width:100%;aspect-ratio:16/6;object-fit:cover;display:block}
.bnl button{position:absolute;right:6px;top:6px}
.slide h2{margin:0;font-size:clamp(22px,4.5vw,40px);line-height:1.15;max-width:18ch}
.slide p{margin:0;opacity:.9;max-width:44ch}
.slide .btn{align-self:flex-start;margin-top:6px;background:var(--s-afg);color:var(--s-accent)}
.dots{position:absolute;right:16px;bottom:12px;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--s-afg);opacity:.4}
.dots i.on{opacity:1}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px}
.sec h2{margin:0;font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.01em;padding-bottom:8px;border-bottom:4px solid var(--s-accent);display:inline-block}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.ctile{position:relative;border:0;padding:0;border-radius:var(--s-radius);overflow:hidden;aspect-ratio:16/10;text-align:left;display:block;width:100%;color:var(--s-afg)}
.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctile.im{color:#fff}
.ctile.im::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.7))}
.ctile span{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font-weight:800;font-size:19px;line-height:1.15;font-family:var(--s-fontd),'Hind Siliguri',serif}
.ctile small{display:block;font-family:var(--s-font),'Hind Siliguri',sans-serif;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.ctile:hover{filter:brightness(1.06)}
.lp-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding-block:28px}
.lp-hero h1{font-size:clamp(28px,5.5vw,52px);line-height:1.1;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
.lp-hero .s{font-size:clamp(16px,2vw,19px);color:var(--s-muted);margin:0 0 16px;max-width:46ch}
.lp-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:calc(var(--s-radius) + 4px);display:block}
.lp-price{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}
.lp-price b{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.02em}
.lp-price s{color:var(--s-muted);font-size:20px}
.cd{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cd div{background:var(--s-fg);color:var(--s-bg);border-radius:var(--s-radius);padding:8px 10px;min-width:58px;text-align:center}
.cd b{display:block;font-size:22px;line-height:1.1}
.cd small{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.feat div{display:flex;gap:12px;align-items:flex-start;background:var(--s-surface);border:1px solid var(--s-line);border-radius:var(--s-radius);padding:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.feat svg{width:22px;height:22px;flex:none;color:var(--s-accent);margin-top:1px}
.lp-body{max-width:68ch;font-size:17px;line-height:1.75;white-space:pre-line}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--s-radius);display:block}
.ord{background:var(--s-surface);border:2px solid var(--s-fg);border-radius:calc(var(--s-radius) + 4px);padding:clamp(16px,4vw,28px);max-width:620px;margin:0 auto}
.ord h2{margin:0 0 14px;font-size:clamp(22px,4vw,30px);font-weight:800}
.stk{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--s-surface);border-top:1px solid var(--s-line);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stk .btn{flex:1;max-width:320px}
@media (min-width:900px){.stk{display:none}}
@media (max-width:820px){.lp-hero{grid-template-columns:1fr}.lp-hero .imgcol{order:-1}}
.lk{font-size:12px;overflow-wrap:anywhere;color:var(--a-muted);user-select:all}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px;border:2px solid var(--s-fg);border-radius:var(--s-radius);background:var(--s-surface);overflow:hidden}
.trust>div{display:flex;gap:9px;align-items:center;padding:8px 12px;min-width:0}
.trust>div+div{border-left:2px solid var(--s-line)}
.trust .ti{width:30px;height:30px;border-radius:50%;background:var(--s-accent);color:var(--s-afg);display:grid;place-items:center;flex:none}
.trust .ti svg{width:16px;height:16px}
.trust b{display:block;font-size:13.5px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.trust small{display:block;font-size:11.5px;color:var(--s-muted);line-height:1.25;overflow-wrap:anywhere}
@media (max-width:900px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}.trust>div:nth-child(3){border-left:0}.trust>div:nth-child(n+3){border-top:2px solid var(--s-line)}}
@media (max-width:600px){.trust>div{padding:7px 9px;gap:7px}.trust .ti{width:26px;height:26px}.trust .ti svg{width:14px;height:14px}.trust b{font-size:12.5px}.trust small{display:none}}
.pays{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.upl{position:relative;display:inline-block;cursor:pointer;overflow:hidden;align-self:flex-start}
.upl input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.vopt{margin:0 0 14px}
.vl{font-weight:700;font-size:14px;margin-bottom:6px}
.vchips{display:flex;gap:8px;flex-wrap:wrap}
.vchip{border:2px solid var(--s-fg);background:transparent;color:var(--s-fg);border-radius:var(--s-radius);padding:6px 14px;font-weight:700;font-size:14px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;min-width:64px}
.vchip small{font-weight:600;font-size:12px;opacity:.8}
.vchip.on{background:var(--s-accent);border-color:var(--s-accent);color:var(--s-afg)}
.vchip[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.vrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:6px;margin-bottom:6px}
@media (max-width:560px){.vrow{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.vrow>input:first-child{grid-column:1/-1}}
.paybox{border:2px dashed var(--s-accent);border-radius:var(--s-radius);padding:12px;margin-bottom:12px;background:color-mix(in srgb,var(--s-accent) 7%,transparent);font-size:14px}
.paybox .pn2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.paybox .pn2 b{font-size:22px;letter-spacing:.04em}
.paybox .cp{border:2px solid var(--s-fg);background:transparent;color:var(--s-fg);border-radius:8px;padding:4px 10px;font-weight:700;font-size:13px}
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;background:#158a45;color:#fff;font-weight:800;font-size:15px;padding:12px 18px;border-radius:999px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.wa svg{width:22px;height:22px;flex:none}
.wa:hover{background:#0f7438}
.btn.wb{border-color:#158a45;color:#158a45;background:transparent}
.btn.wb:hover{background:#158a45;color:#fff}
.pcat{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--s-muted)}
.btn svg{width:17px;height:17px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.card{background:var(--s-surface);border:1px solid var(--s-line);border-radius:var(--s-radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.v-framed .card{outline:1px solid var(--s-accent);outline-offset:-7px}
.v-bold .card{border:2px solid var(--s-fg);box-shadow:4px 4px 0 var(--s-accent)}
.v-soft .card{border:0;box-shadow:0 8px 26px rgba(20,90,50,.12)}
.pimg{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--s-line);cursor:pointer}
.pimgw{position:relative}
.off{position:absolute;left:10px;top:10px;background:var(--s-accent);color:var(--s-afg);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pn{font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;overflow-wrap:anywhere}
.pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pr b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.pr s{color:var(--s-muted);font-size:14px}
.acts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:auto;padding-top:8px}
.btn{border:2px solid var(--s-accent);background:var(--s-accent);color:var(--s-afg);border-radius:var(--s-radius);padding:10px 12px;font-weight:800;font-size:15px;letter-spacing:.02em;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s}
.btn:active{transform:translateY(1px)}
.btn.o{background:transparent;color:var(--s-fg);border-color:var(--s-fg)}
.btn.o:hover:not([disabled]){background:var(--s-fg);color:var(--s-bg)}
.btn.big{padding:12px 16px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.foot{margin-top:44px;border-top:1px solid var(--s-line);background:var(--s-surface)}
.foot .w{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-block:28px}
.foot h3{margin:0 0 8px;font-size:18px;font-weight:800}
.foot p{margin:4px 0;color:var(--s-muted);font-size:14px;overflow-wrap:anywhere}
.foot a{color:var(--s-fg)}
.empty{padding:40px 16px;text-align:center;color:var(--s-muted);border:1px dashed var(--s-line);border-radius:var(--s-radius)}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,12,14,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ov.side{justify-content:flex-end;padding:0}
.md{background:var(--s-surface);color:var(--s-fg);width:100%;max-width:680px;border-radius:calc(var(--s-radius) + 4px);margin:auto;padding:20px;position:relative;font-family:var(--s-font),'Hind Siliguri',sans-serif}
.md.ad{background:var(--a-surface);color:var(--a-fg);font-family:'Inter','Hind Siliguri',sans-serif;border-radius:14px}
.md h2{margin:0 0 14px;font-size:22px}
.drawer{background:var(--s-surface);color:var(--s-fg);width:min(100%,400px);height:100%;display:flex;flex-direction:column;font-family:var(--s-font),'Hind Siliguri',sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) 16px}
.drawer .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin:12px 0}
.citem{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.citem img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--s-line);border-radius:8px}
.qty button{border:0;background:none;width:30px;height:30px;font-size:16px;color:inherit}
.qty span{min-width:28px;text-align:center}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:26px;line-height:1;color:inherit;opacity:.7;width:36px;height:36px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--s-accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-weight:600;font-size:14px}
.fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid var(--s-line);border-radius:8px;background:var(--s-bg);color:var(--s-fg)}
.ad .fld input,.ad .fld textarea,.ad .fld select,.ad-in{border-color:var(--a-line);background:var(--a-bg);color:var(--a-fg)}
.err{color:#d92d20;font-size:13px;min-height:0}
.sum{background:var(--s-bg);border:1px solid var(--s-line);border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.sum .t{font-weight:700;font-size:16px;border-top:1px solid var(--s-line);margin-top:6px;padding-top:8px}
.note{font-size:13px;color:var(--s-muted)}
.ad .note{color:var(--a-muted)}

/* ---------- Admin ---------- */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side-n{background:var(--a-surface);border-right:1px solid var(--a-line);padding:16px 12px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side-n .bn{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700}
.side-n .logo{background:var(--a-brand);color:var(--a-brandfg);border-radius:10px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--a-muted);font-weight:500;font-size:14.5px;white-space:nowrap}
.nv:hover{background:var(--a-bg)}
.nv.on{background:var(--a-soft);color:var(--a-brand);font-weight:700}
.nv .bd{margin-left:auto;background:var(--a-brand);color:var(--a-brandfg);border-radius:999px;font-size:11px;padding:0 7px}
.main{padding:22px max(18px,env(safe-area-inset-right,0px)) 40px 22px;min-width:0}
.main h1{margin:0 0 4px;font-size:24px;font-family:'Space Grotesk','Hind Siliguri',sans-serif}

let saveT=0,idb=null;const IMGK=new Set();
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('dokan_img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function imgKey(s){let h=2166136261;const n=s.length,st=Math.max(1,Math.floor(n/600));for(let i=0;i<n;i+=st){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'idb:'+n.toString(36)+(h>>>0).toString(36)}

function persist(){
  const puts=[];
  const slim=idb?JSON.stringify(db,(k,v)=>{if(typeof v==='string'&&v.length>2000&&v.startsWith('data:image/')){const key=imgKey(v);if(!IMGK.has(key))puts.push([key,v]);return key}return v}):null;
  const full=()=>{try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){storeFull()}};
  if(!idb){full();return}
  const commit=()=>{try{localStorage.setItem(LS,slim)}catch(e){storeFull()}};
  if(!puts.length){commit();return}
  try{
    const tx=idb.transaction('img','readwrite'),st=tx.objectStore('img');
    puts.forEach(([k,v])=>st.put(v,k));
    tx.oncomplete=()=>{puts.forEach(([k])=>IMGK.add(k));commit()};

  }catch(e){idb=null;full()}
}
async function hydrate(){

  await Promise.all([...keys].map(k=>new Promise(res=>{try{const r=st.get(k);r.onsuccess=()=>{if(r.result)map[k]=r.result;res()};r.onerror=()=>res()}catch(e){res()}})));

  Object.keys(map).forEach(k=>IMGK.add(k));
  return keys.size;
}

async function fileToData(file,max=640,png=false){
  if(!file)return null;

  try{
    const im=await fileImg(file),w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
    if(!w||!h)throw new Error('size');
    const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const x=c.getContext('2d');
    if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    return png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.76);
  }catch(e){

function dashHTML(){

  const days=[];for(let i=6;i>=0;i--){const a=sod.getTime()-i*DAY,b=a+DAY;days.push({a,v:o.filter(x=>x.created>=a&&x.created<b&&x.status!=='Cancelled').reduce((s,x)=>s+x.total,0)})}
  const max=Math.max(1,...days.map(d=>d.v)),step=Math.pow(10,Math.floor(Math.log10(max))),top=Math.ceil(max/step)*step;

  let g='';for(let i=0;i<=4;i++){const y=16+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--a-line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${sh(top*i/4)}</text>`}
  days.forEach((d,i)=>{const h=ph*d.v/top,x=L+i*bw+bw*.2,y=16+ph-h;g+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="4" fill="var(--a-brand)"/>${d.v?`<text x="${x+bw*.3}" y="${y-5}" text-anchor="middle">${sh(d.v)}</text>`:''}<text x="${x+bw*.3}" y="${Hh-8}" text-anchor="middle">${new Date(d.a).toLocaleDateString(ui.lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short'})}</text>`});

  <div class="pane"><h3>${ui.lang==='bn'?'সাম্প্রতিক অর্ডার':'Recent orders'}</h3><div class="tw"><table><tr><th>#</th><th>${t('name')}</th><th>${t('total')}</th><th>${t('status')}</th><th>${t('date')}</th></tr>${o.slice(0,5).map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.name)}</td><td class="num">${fmt(x.total)}</td><td>${pill(x.status)}</td><td>${fdate(x.created)}</td></tr>`).join('')}</table></div></div>`;

/* ================= actions ================= */
function addToCart(id,q=1,vid=''){
  const p=db.products.find(x=>x.id===id);if(!p)return false;
  const v=hasV(p)?vOf(p,vid):null;if(hasV(p)&&!v)return false;
  const st=stockOf(p,v);if(st<=0)return false;
  const key=v?v.id:'',c=db.cart.find(x=>x.pid===id&&(x.vid||'')===key);
  if(c)c.qty=Math.min(c.qty+q,st);else db.cart.push({pid:id,vid:key,qty:Math.min(q,st)});
  saveDB();track('AddToCart');return true;
}
function updateCount(){const n=db.cart.reduce((s,c)=>s+c.qty,0);document.querySelectorAll('.s-head .cnt').forEach(e=>{e.textContent=nf(n)})}
function refreshCart(){updateCount();renderModal()}
function openCheckout(){ui.drawer=false;ui.modal={type:'checkout'};updateCount();renderModal();track('InitiateCheckout')}
function capture(){
  const name=($('#f-name')||{}).value||'',phone=norm(($('#f-phone')||{}).value),addr=($('#f-addr')||{}).value||'';
  if(!phoneOk(phone))return;
  let r=db.incomplete.find(x=>x.phone===phone);
  if(!r){r={id:uid('i'),phone};db.incomplete.unshift(r)}
  Object.assign(r,{name:name.trim(),address:addr.trim(),zone:ui.zone,items:cartLines().map(l=>({pid:l.p.id,vid:l.v?l.v.id:'',name:vnm(l.p,l.v),price:unit(l.p,l.v),qty:l.qty})),ts:Date.now()});
  saveDB();
}

 lang(){ui.lang=ui.lang==='bn'?'en':'bn';db.lang=ui.lang;saveDB();renderApp()},

 inc(d){const c=db.cart.find(x=>ck(x)===d.id),p=c&&db.products.find(x=>x.id===c.pid);if(c&&p&&c.qty<stockOf(p,c.vid?vOf(p,c.vid):null))c.qty++;saveDB();refreshCart()},
 dec(d){const c=db.cart.find(x=>ck(x)===d.id);if(c){c.qty--;if(c.qty<=0)db.cart=db.cart.filter(x=>x!==c)}saveDB();refreshCart()},
 rm(d){db.cart=db.cart.filter(x=>ck(x)!==d.id);saveDB();refreshCart()},

 },

 tapply(d){db.theme=d.id;saveDB();renderApp();toast(THEMES[d.id].n)},
 tprev(d){const prev=db.theme;db.theme=d.id;ui.view='shop';ui.previewBack=prev;renderApp();toast(THEMES[d.id].n+' – preview');ui.pv=prev;
  const b=document.createElement('div');b.id='pvbar';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;gap:8px;justify-content:center;padding:10px 10px max(10px,env(safe-area-inset-bottom,0px));background:#111;color:#fff;font:14px Inter,sans-serif';

};
function capLp(){
  const l=curLp(),p=l&&db.products.find(x=>x.id===l.pid);if(!p)return;
  const name=($('#lp-name')||{}).value||'',phone=norm(($('#lp-phone')||{}).value),addr=($('#lp-addr')||{}).value||'';
  if(!phoneOk(phone))return;
  let r=db.incomplete.find(x=>x.phone===phone);
  if(!r){r={id:uid('i'),phone};db.incomplete.unshift(r)}
  Object.assign(r,{name:name.trim(),address:addr.trim(),zone:ui.zone,items:[{pid:p.id,vid:lpVar(p)?lpVar(p).id:'',name:vnm(p,lpVar(p)),price:lpPrice(l,p,lpVar(p)),qty:ui.lpq}],ts:Date.now()});
  saveDB();
}
document.addEventListener('focusin',e=>{if(ui.view==='lp'&&!ui.lpIC&&e.target.closest&&e.target.closest('#lpform')){ui.lpIC=true;track('InitiateCheckout')}});
function copyText(txt){
  const fb=()=>{const b=$('#csvbox');if(b){b.focus();b.select()}toast(ui.lang==='bn'?'সিলেক্ট করা হয়েছে, কপি করুন':'Selected, press copy')};
  try{navigator.clipboard.writeText(txt).then(()=>toast(ui.lang==='bn'?'কপি হয়েছে':'Copied'),fb)}catch(e){fb()}
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=A[a.dataset.act];if(f)f(a.dataset,e)});

/* inputs */
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;
  if(k==='q'){ui.q=e.target.value;$('#grid').innerHTML=gridHTML(db.products.filter(p=>(ui.cat==='all'||p.cat===ui.cat)&&(!ui.q||p.name.toLowerCase().includes(ui.q.toLowerCase()))))}
  else if(k==='of-q'){ui.of.q=e.target.value;$('#otable').innerHTML=orderTable()}
  else if(k==='vf'){const r=ui.modal&&ui.modal.p&&ui.modal.p.variants[+e.target.dataset.i];if(r){const f=e.target.dataset.f;r[f]=f==='name'?e.target.value:(Number(e.target.value)||0)}}
  else if(k==='vlabel'){if(ui.modal&&ui.modal.p)ui.modal.p.vlabel=e.target.value}
  else if(k==='cq'){ui.cq=e.target.value;$('#ctable').innerHTML=custTable()}
  else if(k==='lpcap'){if(e.target.id==='lp-phone'){const v=e.target.value,n=norm(v).slice(0,11);if(v!==n)e.target.value=n}capLp()}
  else if(k==='cap'){if(e.target.id==='f-phone'){const v=e.target.value,n=norm(v).slice(0,11);if(v!==n)e.target.value=n}capture()}
});
document.addEventListener('change',async e=>{
  const k=e.target.dataset&&e.target.dataset.ch;if(!k)return;
  if(k==='pay'){ui.pay=e.target.value;$('#paybox').innerHTML=payBoxInner()}
  else if(k==='lpzone'){ui.zone=e.target.value;$('#lpsum').innerHTML=lpSumInner();refreshPayAmt();capLp()}
  else if(k==='lpimg'){const inp=e.target;for(const f of [...inp.files]){const d=await fileToData(f,1200);if(d)ui.modal.l.imgs.push(d)}inp.value='';paintLimgs()}
  else if(k==='zone'){ui.zone=e.target.value;$('#sumbox').innerHTML=sumInner();refreshPayAmt();capture()}
  else if(k==='banimg'){
    const inp=e.target;let added=0;
    for(const f of [...inp.files]){if(db.banners.length>=5){toast(ui.lang==='bn'?'সর্বোচ্চ ৫টি ব্যানার':'Maximum 5 banners');break}const d=await fileToData(f,1200);if(d){db.banners.push({id:uid('b'),img:d});added++}}
    inp.value='';saveDB();renderApp();if(added)toast(t('save'))}
  else if(k==='of-st'){ui.of.st=e.target.value;$('#otable').innerHTML=orderTable()}
  else if(k==='of-r'){ui.of.range=e.target.value;$('#otable').innerHTML=orderTable()}
  else if(k==='ost'){const o=db.orders.find(x=>x.id===e.target.dataset.id);if(o){o.status=e.target.value;saveDB();renderApp();toast(sLabel(o.status))}}
  else if(k==='logo'||k==='fav'){const inp=e.target,d=await fileToData(inp.files[0],k==='logo'?400:64,true);inp.value='';if(d){db.set[k]=d;saveDB();const el=$(k==='logo'?'#logoPrev':'#favPrev');if(el)el.innerHTML=`<img src="${d}" alt="">`;toast(t('save'))}}
  else if(k==='pimg'){
    const inp=e.target,files=[...inp.files],imgs=ui.modal.p.images;let skipped=0;
    for(const f of files){if(imgs.length>=4){skipped++;continue}const d=await fileToData(f);if(d)imgs.push(d)}
    inp.value='';if(skipped)toast(ui.lang==='bn'?'প্রতিটি প্রোডাক্টে সর্বোচ্চ ৪টি ছবি দেওয়া যায়':'Maximum 4 images per product');
    paintPimgs()}
  else if(k==='cimg'){const inp=e.target,d=await fileToData(inp.files[0],640);inp.value='';if(d){ui.modal.c.img=d;paintCimg()}}
});

/* forms */
const F={
 login(f){const v=new FormData(f);if(v.get('u')==='admin'&&v.get('p')==='admin123'){ui.auth=true;renderApp()}else $('#e-login').textContent=ui.lang==='bn'?'ইউজারনেম বা পাসওয়ার্ড ভুল':'Wrong username or password'},
 order(f){
  const v=new FormData(f),name=String(v.get('name')).trim(),phone=norm(v.get('phone')),addr=String(v.get('addr')).trim();let bad=false;
  const set=(id,m)=>{$('#'+id).textContent=m||'';if(m)bad=true};
  set('e-name',name.length<2?t('nameErr'):'');set('e-phone',phoneOk(phone)?'':t('phoneErr'));set('e-addr',addr.length<6?t('addrErr'):'');const pay=readPay(v,set);
  if(bad)return;
  const L=cartLines();if(!L.length)return;
  const sub=cartSub(),dl=delivFor(ui.zone);
  const o={id:uid('o'),no:'ORD-'+(db.seq++),name,phone,address:addr,zone:ui.zone,pay,paid:false,items:L.map(l=>({pid:l.p.id,vid:l.v?l.v.id:'',name:vnm(l.p,l.v),price:unit(l.p,l.v),qty:l.qty})),sub,delivery:dl,total:sub+dl,status:'Pending',created:Date.now(),courier:null,tracking:null};
  L.forEach(l=>{if(l.v){l.v.stock=Math.max(0,l.v.stock-l.qty);l.p.stock=totStock(l.p)}else l.p.stock=Math.max(0,l.p.stock-l.qty)});
  db.orders.unshift(o);db.incomplete=db.incomplete.filter(x=>x.phone!==phone);db.cart=[];saveDB();
  ui.modal={type:'thanks',order:o};renderApp();track('Purchase',o);
 },
 lporder(f){
  const l=curLp(),p=l&&db.products.find(x=>x.id===l.pid);if(!p)return;const vr=lpVar(p);if(hasV(p)?!vr:p.stock<=0)return;
  const v=new FormData(f),name=String(v.get('name')).trim(),phone=norm(v.get('phone')),addr=String(v.get('addr')).trim();let bad=false;
  const set=(id,m)=>{$('#'+id).textContent=m||'';if(m)bad=true};
  set('e-name',name.length<2?t('nameErr'):'');set('e-phone',phoneOk(phone)?'':t('phoneErr'));set('e-addr',addr.length<6?t('addrErr'):'');const pay=readPay(v,set);
  if(bad)return;
  const q=Math.min(ui.lpq,stockOf(p,vr)),pr=lpPrice(l,p,vr),sub=pr*q,dl=delivFor(ui.zone);
  const o={id:uid('o'),no:'ORD-'+(db.seq++),name,phone,address:addr,zone:ui.zone,pay,paid:false,src:'lp:'+l.slug,items:[{pid:p.id,vid:vr?vr.id:'',name:vnm(p,vr),price:pr,qty:q}],sub,delivery:dl,total:sub+dl,status:'Pending',created:Date.now(),courier:null,tracking:null};
  if(vr){vr.stock=Math.max(0,vr.stock-q);p.stock=totStock(p)}else p.stock=Math.max(0,p.stock-q);db.orders.unshift(o);db.incomplete=db.incomplete.filter(x=>x.phone!==phone);saveDB();
  ui.lpq=1;ui.modal={type:'thanks',order:o};renderApp();track('Purchase',o);
 },
 lp(f){
  const v=new FormData(f),l=ui.modal.l;
  let slug=String(v.get('slug')||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if(!slug)slug='lp-'+Math.random().toString(36).slice(2,7);
  if(db.lps.some(x=>x.slug===slug&&x.id!==l.id))slug+='-'+Math.random().toString(36).slice(2,4);
  const d={slug,pid:v.get('pid'),headline:String(v.get('headline')).trim(),sub:String(v.get('sub')).trim(),cta:String(v.get('cta')).trim(),price:Number(v.get('price'))||'',offerEnd:v.get('end')||'',features:String(v.get('features')).split('\n').map(x=>x.trim()).filter(Boolean),body:String(v.get('body')).trim(),imgs:l.imgs,on:!!v.get('on')};
  if(l.id)Object.assign(db.lps.find(x=>x.id===l.id),d);else db.lps.unshift({id:uid('l'),...d});
  saveDB();ui.modal=null;renderApp();toast(t('save'));
 },
 courier(f){const v=new FormData(f);db.couriers.push({id:uid('k'),name:v.get('n'),base:v.get('u'),key:v.get('k'),secret:v.get('s')});saveDB();renderApp();toast(t('add'))},
 mkt(f){const v=new FormData(f);Object.assign(db.mkt,{pixelId:v.get('p').trim(),token:v.get('tk').trim(),testCode:v.get('c').trim(),on:!!v.get('on'),server:!!v.get('sv')});saveDB();renderApp();toast(t('save'))},
 set(f){const v=new FormData(f);['name','tag','phone','email','address','fb','ig','wa','details'].forEach(k=>db.set[k]=String(v.get(k)).trim());db.set.delivIn=Number(v.get('delivIn'))||0;db.set.delivOut=Number(v.get('delivOut'))||0;db.set.bkash=norm(v.get('bkash'));db.set.nagad=norm(v.get('nagad'));db.set.payBkash=!!v.get('payBkash');db.set.payNagad=!!v.get('payNagad');saveDB();renderApp();toast(t('save'))},
 product(f){
  const v=new FormData(f),p=ui.modal.p;
  const vs=(p.variants||[]).filter(r=>String(r.name).trim()&&Number(r.price)>0).map(r=>({id:r.id,name:String(r.name).trim(),price:Number(r.price),sale:(Number(r.sale)>0&&Number(r.sale)<Number(r.price))?Number(r.sale):0,stock:Math.max(0,Number(r.stock)||0)}));
  let price=Number(v.get('price')),sale=Number(v.get('sale'))||0,stock=Number(v.get('stock'))||0;
  if(vs.length){price=Math.min(...vs.map(x=>x.price));sale=0;stock=vs.reduce((s,x)=>s+x.stock,0)}
  else if(!(price>0)){toast(ui.lang==='bn'?'দাম লিখুন বা অপশন যোগ করুন':'Enter a price or add options');return}
  const d={name:String(v.get('name')).trim(),cat:v.get('cat'),price,sale:sale<price?sale:0,stock,desc:String(v.get('desc')).trim(),images:p.images,hue:p.hue,variants:vs,vlabel:String(p.vlabel||'').trim()};
  if(p.id){Object.assign(db.products.find(x=>x.id===p.id),d)}else db.products.unshift({id:uid('p'),...d});
  saveDB();ui.modal=null;renderApp();toast(t('save'));
 },
 cat(f){const v=new FormData(f),c=ui.modal.c,name=String(v.get('name')).trim();if(c.id){Object.assign(db.categories.find(x=>x.id===c.id),{name,img:c.img})}else db.categories.push({id:uid('c'),name,img:c.img});saveDB();ui.modal=null;renderApp();toast(t('save'))}
};
document.addEventListener('submit',e=>{e.preventDefault();const f=F[e.target.dataset.form];if(f)f(e.target)});
